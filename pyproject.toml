[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-sat"
version = "0.1.0"
description = "Standalone SocketCAN utilities with project-local config"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Satvir" }]

[project.scripts]
can-sat = "can_sat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
